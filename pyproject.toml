[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnbreak"
version = "0.1.0"
description = "Shows you something worth reading while your coding agent works, then notifies you when it's done."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hristo Hristov" }]
dependencies = []

[project.scripts]
turnbreak = "turnbreak.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
sources = ["trafilatura", "feedparser", "pypdf"]

[tool.hatch.build.targets.wheel]
packages = ["src/turnbreak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
