ength="8" class="background"> </text></g><g id="g12"><text x="0" textLength="8" class="color6">&#10255;</text><text x="8" textLength="136" class="foreground"> agent working...</text><text x="144" textLength="8" class="background"> </text></g><g id="g13"><text x="0" textLength="8" class="color6">&#10251;</text><text x="8" textLength="136" class="foreground"> agent working...</text><text x="144" textLength="8" class="background"> </text></g><g id="g14"><text x="0" textLength="8" class="color2">&#10003;</text><text x="8" textLength="136" class="foreground"> agent working...</text></g><g id="g15"><text x="0" textLength="280" class="foreground">a reading tab opens in the browser:</text></g><g id="g16"><text x="0" textLength="480" class="foreground">&#9484;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9488;</text></g><g id="g17"><text x="0" textLength="16" class="foreground">&#9474; </text><text x="16" textLength="280" font-weight="bold" class="foreground">http-caching (folder) &#8212; ~1 min read</text><text x="296" textLength="184" class="foreground">                      &#9474;</text></g><g id="g18"><text x="0" textLength="480" class="foreground">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text></g><g id="g19"><text x="0" textLength="480" class="foreground">&#9474; Cache-Control tells a client how long a response stays   &#9474;</text></g><g id="g20"><text x="0" textLength="480" class="foreground">&#9474; fresh, in                                                &#9474;</text></g><g id="g21"><text x="0" textLength="480" class="foreground">&#9474; seconds, with max-age. ETag gives the client a           &#9474;</text></g><g id="g22"><text x="0" textLength="480" class="foreground">&#9474; fingerprint of the                                       &#9474;</text></g><g id="g23"><text x="0" textLength="480" class="foreground">&#9474; response body, so a later request can ask "has this      &#9474;</text></g><g id="g24"><text x="0" textLength="480" class="foreground">&#9474; &#8230;                                                        &#9474;</text></g><g id="g25"><text x="0" textLength="480" class="foreground">&#9492;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9496;</text></g><g id="g26"><text x="0" textLength="336" class="foreground">turn ended &#183; tab title and favicon updated</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="340"/><use xlink:href="#g3" y="357"/><rect x="0" y="374" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="374"/></g><g><use xlink:href="#g1" y="680"/><use xlink:href="#g3" y="697"/><rect x="0" y="731" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="731"/></g><g><use xlink:href="#g1" y="1020"/><use xlink:href="#g3" y="1037"/><rect x="144" y="1071" wid