<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 720 410" width="720" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="90" rows="24"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }
    
            :root {
                --animation-duration: 12658ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
12.016%{transform:translateY(-442px)}
24.032%{transform:translateY(-884px)}
59.772%{transform:translateY(-1326px)}
63.762%{transform:translateY(-1768px)}
63.778%{transform:translateY(-2210px)}
79.728%{transform:translateY(-2652px)}
79.760%{transform:translateY(-3094px)}
92.100%{transform:translateY(-3536px)}
100.000%{transform:translateY(-3536px)}
            }

            #screen_view {
                animation-duration: 12658ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
            /* The colors defined below are the default 16 colors used for rendering text of the terminal. Adjust
               them as needed.
               PowerShell colors based on https://en.wikipedia.org/wiki/ANSI_escape_code#Colors */
            .foreground {fill: #cccccc;}
            .background {fill: #0c0c0c;}
            .color0 {fill: #0c0c0c;}
            .color1 {fill: #c50f1f;}
            .color2 {fill: #13a10e;}
            .color3 {fill: #c19c00;}
            .color4 {fill: #0037da;}
            .color5 {fill: #881798;}
            .color6 {fill: #3a96dd;}
            .color7 {fill: #cccccc;}
            .color8 {fill: #767676;}
            .color9 {fill: #e74856;}
            .color10 {fill: #16c60c;}
            .color11 {fill: #f9f1a5;}
            .color12 {fill: #3b78ff;}
            .color13 {fill: #b4009e;}
            .color14 {fill: #61d6d6;}
            .color15 {fill: #f2f2f2;}
        </style>
    </defs>
    <svg id="screen" width="720" height="408" viewBox="0 0 720 408" preserveAspectRatio="xMidYMin slice">
    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="8" class="color2">$</text><text x="8" textLength="200" class="foreground"> turnbreak install claude</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="8" class="color2">$</text><text x="8" textLength="240" class="foreground"> turnbreak mode folder ~/notes</text></g><g id="g4"><text x="0" textLength="264" class="foreground"># the agent starts a long task...</text></g><g id="g5"><text x="0" textLength="8" class="color2">$</text><text x="8" textLength="128" class="foreground"> turnbreak watch</text></g><g id="g6"><text x="0" textLength="280" class="foreground">http-caching (folder) &#8212; ~1 min read</text></g><g id="g7"><text x="0" textLength="184" class="foreground"># HTTP caching, briefly</text></g><g id="g8"><text x="0" textLength="512" class="foreground">Cache-Control tells a client how long a response stays fresh, in</text></g><g id="g9"><text x="0" textLength="520" class="foreground">seconds, with max-age. ETag gives the client a fingerprint of the</text></g><g id="g10"><text x="0" textLength="528" class="foreground">response body, so a later request can ask "has this changed?" with</text></g><g id="g11"><text x="0" textLength="472" class="foreground">If-None-Match instead of downloading the whole thing again.</text></g><g id="g12"><text x="0" textLength="528" class="foreground">A server that supports both can answer most repeat requests with a</text></g><g id="g13"><text x="0" textLength="560" class="foreground">304 Not Modified and no body at all. The client keeps its cached copy.</text></g><g id="g14"><text x="0" textLength="504" class="foreground">This is why a well-configured static site can serve a returning</text></g><g id="g15"><text x="0" textLength="544" class="foreground">visitor almost nothing on their second load, and why a misconfigured</text></g><g id="g16"><text x="0" textLength="552" class="foreground">one re-sends the same megabyte of JavaScript on every single request.</text></g><g id="g17"><text x="0" textLength="560" class="foreground">The two headers solve different problems. max-age lets the client skip</text></g><g id="g18"><text x="0" textLength="560" class="foreground">the request entirely for a while, which is the cheapest possible cache</text></g><g id="g19"><text x="0" textLength="544" class="foreground">hit: no round trip at all. ETag matters once max-age has expired, or</text></g><g id="g20"><text x="0" textLength="512" class="foreground">was never set, because it lets the round trip happen without the</text></g><g id="g21"><text x="0" textLength="528" class="foreground">transfer. A request with If-None-Match still costs a connection an</text><text x="528" textLength="8" class="background"> </text></g><g id="g22"><text x="0" textLength="552" class="foreground">transfer. A request with If-None-Match still costs a connection and a</text></g><g id="g23"><text x="0" textLength="224" class="foreground">server-side lookup, just not</text></g><g id="g24"><text x="0" textLength="216" class="foreground"># ...and the agent finishes</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="442"/><use xlink:href="#g3" y="459"/><rect x="0" y="476" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="476"/></g><g><use xlink:href="#g1" y="884"/><use xlink:href="#g3" y="901"/><use xlink:href="#g4" y="935"/><rect x="0" y="952" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="952"/></g><g><use xlink:href="#g1" y="1326"/><use xlink:href="#g3" y="1343"/><use xlink:href="#g4" y="1377"/><use xlink:href="#g5" y="1411"/><rect x="0" y="1428" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1428"/></g><g><use xlink:href="#g3" y="1768"/><use xlink:href="#g4" y="1802"/><use xlink:href="#g5" y="1836"/><use xlink:href="#g6" y="1853"/><use xlink:href="#g7" y="1870"/><use xlink:href="#g8" y="1904"/><use xlink:href="#g9" y="1921"/><use xlink:href="#g10" y="1938"/><use xlink:href="#g11" y="1955"/><use xlink:href="#g12" y="1989"/><use xlink:href="#g13" y="2006"/><use xlink:href="#g14" y="2023"/><use xlink:href="#g15" y="2040"/><use xlink:href="#g16" y="2057"/><use xlink:href="#g17" y="2091"/><use xlink:href="#g18" y="2108"/><use xlink:href="#g19" y="2125"/><use xlink:href="#g20" y="2142"/><rect x="528" y="2159" width="8" height="17" class="foreground"/><use xlink:href="#g21" y="2159"/></g><g><use xlink:href="#g4" y="2210"/><use xlink:href="#g5" y="2244"/><use xlink:href="#g6" y="2261"/><use xlink:href="#g7" y="2278"/><use xlink:href="#g8" y="2312"/><use xlink:href="#g9" y="2329"/><use xlink:href="#g10" y="2346"/><use xlink:href="#g11" y="2363"/><use xlink:href="#g12" y="2397"/><use xlink:href="#g13" y="2414"/><use xlink:href="#g14" y="2431"/><use xlink:href="#g15" y="2448"/><use xlink:href="#g16" y="2465"/><use xlink:href="#g17" y="2499"/><use xlink:href="#g18" y="2516"/><use xlink:href="#g19" y="2533"/><use xlink:href="#g20" y="2550"/><use xlink:href="#g22" y="2567"/><use xlink:href="#g23" y="2584"/><rect x="0" y="2601" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2601"/></g><g><use xlink:href="#g5" y="2669"/><use xlink:href="#g6" y="2686"/><use xlink:href="#g7" y="2703"/><use xlink:href="#g8" y="2737"/><use xlink:href="#g9" y="2754"/><use xlink:href="#g10" y="2771"/><use xlink:href="#g11" y="2788"/><use xlink:href="#g12" y="2822"/><use xlink:href="#g13" y="2839"/><use xlink:href="#g14" y="2856"/><use xlink:href="#g15" y="2873"/><use xlink:href="#g16" y="2890"/><use xlink:href="#g17" y="2924"/><use xlink:href="#g18" y="2941"/><use xlink:href="#g19" y="2958"/><use xlink:href="#g20" y="2975"/><use xlink:href="#g22" y="2992"/><use xlink:href="#g23" y="3009"/><rect x="0" y="3043" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="3043"/></g><g><use xlink:href="#g5" y="3094"/><use xlink:href="#g6" y="3111"/><use xlink:href="#g7" y="3128"/><use xlink:href="#g8" y="3162"/><use xlink:href="#g9" y="3179"/><use xlink:href="#g10" y="3196"/><use xlink:href="#g11" y="3213"/><use xlink:href="#g12" y="3247"/><use xlink:href="#g13" y="3264"/><use xlink:href="#g14" y="3281"/><use xlink:href="#g15" y="3298"/><use xlink:href="#g16" y="3315"/><use xlink:href="#g17" y="3349"/><use xlink:href="#g18" y="3366"/><use xlink:href="#g19" y="3383"/><use xlink:href="#g20" y="3400"/><use xlink:href="#g22" y="3417"/><use xlink:href="#g23" y="3434"/><use xlink:href="#g24" y="3468"/><rect x="0" y="3485" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="3485"/></g><g><use xlink:href="#g6" y="3536"/><use xlink:href="#g7" y="3553"/><use xlink:href="#g8" y="3587"/><use xlink:href="#g9" y="3604"/><use xlink:href="#g10" y="3621"/><use xlink:href="#g11" y="3638"/><use xlink:href="#g12" y="3672"/><use xlink:href="#g13" y="3689"/><use xlink:href="#g14" y="3706"/><use xlink:href="#g15" y="3723"/><use xlink:href="#g16" y="3740"/><use xlink:href="#g17" y="3774"/><use xlink:href="#g18" y="3791"/><use xlink:href="#g19" y="3808"/><use xlink:href="#g20" y="3825"/><use xlink:href="#g22" y="3842"/><use xlink:href="#g23" y="3859"/><use xlink:href="#g24" y="3893"/><rect x="0" y="3927" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="3927"/></g></g></svg>
</svg>