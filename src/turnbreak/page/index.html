<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>turnbreak</title>
<link
  rel="icon"
  id="favicon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234a90d9'/%3E%3C/svg%3E"
/>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 40rem;
    margin: 3rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  #meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
  #placeholder { color: #666; }
  #body { white-space: pre-wrap; }
  #actions { margin-top: 2rem; display: flex; gap: 0.75rem; }
  button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div id="meta"><span id="source"></span><span id="read-minutes"></span></div>
  <h1 id="item-title">Waiting for the first item&hellip;</h1>
  <p id="placeholder">
    Nothing to show yet. This tab updates itself once your agent has been working long enough.
  </p>
  <div id="body"></div>
  <div id="actions" hidden>
    <button id="read-btn" type="button">Read</button>
    <button id="skip-btn" type="button">Skip</button>
    <button id="keep-btn" type="button">Keep reading</button>
  </div>

<script>
(function () {
  const DONE_FAVICON =
    "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E" +
    "%3Ccircle cx='8' cy='8' r='7' fill='%23d9534f'/%3E%3C/svg%3E";
  const DEFAULT_TITLE = document.title;

  if (window.Notification && Notification.permission === "default") {
    Notification.requestPermission();
  }

  function showItem(item) {
    document.getElementById("placeholder").hidden = true;
    document.getElementById("actions").hidden = false;
    document.getElementById("item-title").textContent = item.title || "";
    document.getElementById("source").textContent = item.source || "";
    document.getElementById("read-minutes").textContent = item.read_minutes
      ? " · " + item.read_minutes + " min read"
      : "";
    document.getElementById("body").textContent = item.body || "";
  }

  function markDone() {
    document.title = "✓ " + DEFAULT_TITLE;
    document.getElementById("favicon").href = DONE_FAVICON;
    if (window.Notification && Notification.permission === "granted") {
      new Notification("turnbreak", { body: "Your agent finished its turn." });
    }
  }

  const events = new EventSource("/events");
  events.addEventListener("item", function (e) {
    showItem(JSON.parse(e.data));
  });
  events.addEventListener("done", function () {
    markDone();
  });

  function sendAction(action) {
    fetch("/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: action }),
    });
  }

  document.getElementById("read-btn").addEventListener("click", function () {
    sendAction("read");
  });
  document.getElementById("skip-btn").addEventListener("click", function () {
    sendAction("skip");
  });
  document.getElementById("keep-btn").addEventListener("click", function () {
    sendAction("keep");
  });
})();
</script>
</body>
</html>
